<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', Helvetica, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
    <style>
      .box{fill:#fff;stroke:#333;stroke-width:1.5;rx:8}
      .mitm{fill:#fff4e0;stroke:#c05621}
      .t{fill:#222}
      .sub{fill:#666;font-size:12px}
      .h{font-weight:700;font-size:16px;fill:#222}
      .edge{stroke:#555;stroke-width:1.5;fill:none;marker-end:url(#arr)}
      .lab{fill:#444;font-size:12px}
      .mono{font-family:Menlo, monospace;font-size:12px}
      .step{fill:#2b6cb0;font-weight:700;font-size:12px}
    </style>
  </defs>

  <text x="450" y="30" text-anchor="middle" class="h">방법 B · mitmproxy가 앱과 Tidal 서버 사이에서 토큰을 보여주는 구조</text>

  <!-- Tidal app -->
  <rect x="40" y="120" width="180" height="90" class="box"/>
  <text x="130" y="150" text-anchor="middle" class="t">Tidal 데스크톱 앱</text>
  <text x="130" y="170" text-anchor="middle" class="sub">(로그인 유지 중)</text>
  <text x="130" y="192" text-anchor="middle" class="sub">시스템 프록시 설정을 따름</text>

  <!-- mitmproxy -->
  <rect x="340" y="105" width="220" height="120" class="box mitm"/>
  <text x="450" y="132" text-anchor="middle" class="t">mitmweb</text>
  <text x="450" y="152" text-anchor="middle" class="mono">127.0.0.1:8080 (프록시)</text>
  <text x="450" y="170" text-anchor="middle" class="mono">127.0.0.1:8081 (화면 UI)</text>
  <text x="450" y="196" text-anchor="middle" class="sub">HTTPS를 풀어서 요청 헤더를</text>
  <text x="450" y="212" text-anchor="middle" class="sub">그대로 보여줌</text>

  <!-- Tidal API -->
  <rect x="680" y="120" width="180" height="90" class="box"/>
  <text x="770" y="150" text-anchor="middle" class="t">Tidal API 서버</text>
  <text x="770" y="170" text-anchor="middle" class="mono">api.tidal.com</text>

  <!-- arrows -->
  <path d="M220,150 L340,150" class="edge"/>
  <text x="280" y="140" text-anchor="middle" class="lab">① 요청</text>
  <path d="M560,150 L680,150" class="edge"/>
  <text x="620" y="140" text-anchor="middle" class="lab">② 그대로 전달</text>
  <path d="M680,185 L560,185" class="edge"/>
  <text x="620" y="205" text-anchor="middle" class="lab">③ 응답</text>
  <path d="M340,185 L220,185" class="edge"/>
  <text x="280" y="205" text-anchor="middle" class="lab">④ 응답</text>

  <!-- captured header -->
  <path d="M450,225 L450,262" class="edge"/>
  <rect x="200" y="262" width="500" height="70" class="box"/>
  <text x="215" y="286" class="mono">GET /v1/users/12345678/favorites/tracks?countryCode=KR</text>
  <text x="215" y="306" class="mono" fill="#c05621">authorization: Bearer eyJhbGciOiJSUzI1NiJ9…   ← 이 값을 복사</text>
  <text x="215" y="324" class="sub">mitmweb 화면에서 요청 클릭 → Request 탭</text>

  <!-- prerequisites -->
  <text x="40" y="60" class="step">준비 1</text>
  <text x="90" y="60" class="lab">시스템 설정 → 네트워크 → 프록시: HTTP·HTTPS 모두 127.0.0.1:8080</text>
  <text x="40" y="80" class="step">준비 2</text>
  <text x="90" y="80" class="lab">mitmproxy CA 인증서를 키체인에 "항상 신뢰"로 등록 (없으면 HTTPS가 깨짐)</text>
</svg>
