<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', Helvetica, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
    <style>
      .box{fill:#fff;stroke:#333;stroke-width:1.5;rx:8}
      .acc{fill:#e8f1fb;stroke:#2b6cb0}
      .warn{fill:#fff4e0;stroke:#c05621}
      .ok{fill:#e6f6ec;stroke:#2f855a}
      .file{fill:#f7f7f7;stroke:#666;stroke-dasharray:4 3}
      .t{fill:#222}
      .sub{fill:#666;font-size:12px}
      .h{font-weight:700;font-size:16px;fill:#222}
      .edge{stroke:#555;stroke-width:1.5;fill:none;marker-end:url(#arr)}
      .lab{fill:#444;font-size:12px}
    </style>
  </defs>

  <text x="450" y="30" text-anchor="middle" class="h">Tidal favorites backup &amp; restore — overview</text>

  <!-- Q1: can you sign in? -->
  <rect x="325" y="44" width="250" height="40" class="box acc"/>
  <text x="450" y="69" text-anchor="middle" class="t">Can you sign in to Tidal again?</text>

  <!-- Case 1 -->
  <path d="M325,64 L155,64 L155,150" class="edge"/>
  <text x="238" y="57" text-anchor="middle" class="lab">Yes</text>
  <rect x="15" y="150" width="280" height="86" class="box ok"/>
  <text x="155" y="174" text-anchor="middle" class="t">Case 1 · Device-code sign-in</text>
  <text x="155" y="195" text-anchor="middle" class="sub">run python3 tidal_backup.py</text>
  <text x="155" y="213" text-anchor="middle" class="sub">→ sign in via link.tidal.com</text>

  <!-- Q2: where is the live session? -->
  <path d="M575,64 L725,64 L725,86" class="edge"/>
  <text x="650" y="57" text-anchor="middle" class="lab">No</text>
  <rect x="590" y="86" width="270" height="34" class="box acc"/>
  <text x="725" y="108" text-anchor="middle" class="t">Where is the live session?</text>

  <!-- Case 2 -->
  <path d="M690,120 L450,120 L450,150" class="edge"/>
  <text x="530" y="137" text-anchor="middle" class="lab">web browser</text>
  <rect x="310" y="150" width="280" height="86" class="box warn"/>
  <text x="450" y="174" text-anchor="middle" class="t">Case 2 · Copy from the browser</text>
  <text x="450" y="195" text-anchor="middle" class="sub">DevTools on listen.tidal.com</text>
  <text x="450" y="213" text-anchor="middle" class="sub">→ copy the authorization header</text>

  <!-- Case 3 -->
  <path d="M760,120 L760,150" class="edge"/>
  <text x="812" y="137" text-anchor="middle" class="lab">desktop app</text>
  <rect x="620" y="150" width="265" height="86" class="box warn"/>
  <text x="752" y="174" text-anchor="middle" class="t">Case 3 · Capture from the app</text>
  <text x="752" y="195" text-anchor="middle" class="sub">mitmproxy + trust the CA cert</text>
  <text x="752" y="213" text-anchor="middle" class="sub">→ relaunch Tidal, copy the header</text>

  <!-- Token -->
  <path d="M155,236 L155,288 L340,288" class="edge"/>
  <path d="M450,236 L450,268" class="edge"/>
  <path d="M752,236 L752,288 L560,288" class="edge"/>
  <rect x="340" y="268" width="220" height="40" class="box acc"/>
  <text x="450" y="293" text-anchor="middle" class="t">access token obtained</text>

  <!-- Backup script -->
  <path d="M450,308 L450,330" class="edge"/>
  <rect x="330" y="330" width="240" height="48" class="box"/>
  <text x="450" y="350" text-anchor="middle" class="t" font-family="Menlo, monospace" font-size="13">python3 tidal_backup.py</text>
  <text x="450" y="368" text-anchor="middle" class="sub">download all favorites via the API</text>

  <!-- Backup output -->
  <path d="M450,378 L450,402" class="edge"/>
  <rect x="280" y="402" width="340" height="52" class="box file"/>
  <text x="450" y="422" text-anchor="middle" class="t" font-family="Menlo, monospace" font-size="12">tidal_backup/</text>
  <text x="450" y="440" text-anchor="middle" class="sub">tracks · albums · artists · playlists (JSON + CSV)</text>

  <!-- Restore side -->
  <path d="M600,428 L660,428" class="edge"/>
  <rect x="660" y="402" width="200" height="52" class="box"/>
  <text x="760" y="422" text-anchor="middle" class="t" font-family="Menlo, monospace" font-size="13">python3 tidal_restore.py</text>
  <text x="760" y="440" text-anchor="middle" class="sub">restores into that account</text>
  <rect x="660" y="318" width="200" height="56" class="box acc"/>
  <text x="760" y="340" text-anchor="middle" class="lab">Sign in as target account</text>
  <text x="760" y="358" text-anchor="middle" class="lab">(tidal_auth.py --logout first)</text>
  <path d="M760,374 L760,402" class="edge"/>
</svg>
